apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.fitsaathi.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fitsaathi.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI sets VERSION_CODE / VERSION_NAME (see .github/workflows/build.yml); local builds get 1 / 1.0.0.
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName System.getenv("VERSION_NAME") ?: "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    lint {
        // Report everything but do not abort release builds on warnings-as-errors; see docs/SELF_CHECK_REPORT.md
        abortOnError false
        checkReleaseBuilds true
    }
    // Release signing comes from the environment (CI decodes the upload keystore into ANDROID_KEYSTORE_PATH).
    // Without it the release build is signed with the committed debug keystore so it still installs for
    // testing; Play will refuse such an upload, hence the warning.
    def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
    def releaseKeystoreFile = (releaseKeystorePath != null && !releaseKeystorePath.isEmpty()) ? file(releaseKeystorePath) : null
    def hasReleaseKeystore = releaseKeystoreFile != null && releaseKeystoreFile.exists()
    if (!hasReleaseKeystore) {
        logger.warn("WARNING: ANDROID_KEYSTORE_PATH is unset or does not exist; the release build will be signed with the debug keystore (not accepted by Google Play).")
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseKeystore) {
                storeFile releaseKeystoreFile
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            } else {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        jniLibs {
            // 16 KB page-size compliance (Play requirement for targetSdk 35+): keep native libraries uncompressed
            // and page-aligned in the APK. sqlcipher-android 4.17.0 ships 16 KB aligned .so files.
            useLegacyPackaging = false
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // FitSaathi native features
    implementation "androidx.health.connect:connect-client:$healthConnectVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.biometric:biometric:1.1.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
